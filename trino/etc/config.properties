coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# The single-node workstation uses a measured 4 GiB JVM within a 6 GiB
# container limit. Bound total query memory at 1.5 GiB so clean CDC replay keeps
# heap headroom for Iceberg/REST-catalog planning and metadata allocations. The
# 2,000,000 character text ceiling keeps parameter-expanded batches bounded.
query.max-memory=1GB
query.max-total-memory=1536MB
query.max-length=2000000

coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080

# The single-node workstation runs a 2 GiB JVM. Bound total query memory at
# 1.5 GiB to leave heap for Iceberg/REST-catalog allocations. The 2,000,000
# character text ceiling permits rebuild INSERT batches below the server limit.
query.max-memory=1GB
query.max-total-memory=1536MB
query.max-length=2000000

name: ci

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: mypy (non-blocking during bootstrap)
        continue-on-error: true
        run: uv run mypy src tests

      - name: Pytest
        run: uv run pytest

      - name: dbt parse (offline manifest check)
        run: uv run dbt parse --project-dir dbt --profiles-dir dbt

      - name: Docker Compose config
        if: hashFiles('docker-compose.yml') != ''
        run: |
          cp .env.example .env
          docker compose config --quiet

  airflow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Airflow image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infrastructure/airflow/Dockerfile
          tags: omni-retail/airflow:0.1.0
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: DAG tests (pytest + import errors, inside the image)
        run: bash infrastructure/scripts/airflow_tests.sh
        env:
          AIRFLOW_SKIP_BUILD: "1"

version: 2

sources:
  - name: bronze
    catalog: "{{ env_var('TRINO_CATALOG', 'iceberg') }}"
    schema: "{{ env_var('DBT_BRONZE_SCHEMA', 'bronze') }}"
    config:
      freshness:
        warn_after: {count: 48, period: hour}
        error_after: {count: 7, period: day}
      loaded_at_field: _ingested_at
    tables:
      - name: categories
      - name: products
      - name: customers
      - name: orders
      - name: order_items
      - name: payments
      - name: shipments
      - name: fx_rates
      - name: campaigns
      - name: deliveries
      - name: postgres_cdc_events
        description: >
          Immutable PostgreSQL Debezium event ledger. Grain: one row per
          Kafka transport coordinate (topic, partition, offset); event_id is
          the deterministic transport identity. Typed projections must rank
          all operations before applying delete semantics.
        columns:
          - name: event_id
            tests: [unique, not_null]
          - name: source_schema
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["public"]
          - name: source_table
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["customers", "orders", "payments"]
          - name: operation
            tests:
              - not_null
              - accepted_values:
                  arguments:
                    values: ["r", "c", "u", "d"]
          - name: kafka_topic
            tests: [not_null]
          - name: kafka_partition
            tests: [not_null]
          - name: kafka_offset
            tests: [not_null]

version: 2

sources:
  - name: bronze
    catalog: "{{ env_var('TRINO_CATALOG', 'iceberg') }}"
    schema: "{{ env_var('DBT_BRONZE_SCHEMA', 'bronze') }}"
    config:
      freshness:
        warn_after: {count: 48, period: hour}
        error_after: {count: 7, period: day}
      loaded_at_field: _ingested_at
    tables:
      - name: categories
      - name: products
      - name: customers
      - name: orders
      - name: order_items
      - name: payments
      - name: shipments
      - name: fx_rates
      - name: campaigns
      - name: deliveries

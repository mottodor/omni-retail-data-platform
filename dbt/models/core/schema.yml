version: 2

models:
  - name: dim_date
    description: >
      Calendar dimension. Purpose: standardized date attributes for drill-downs.
      Grain: one row per calendar day in the live CDC order-activity window
      (created_at/updated_at of fact_orders). PK: date_key.
      Upstream: fact_orders (bounds only).
    columns:
      - name: date_key
        description: Integer surrogate key in yyyymmdd form.
        tests: [unique, not_null]
      - name: full_date
        description: The calendar day.
        tests: [unique, not_null]

  - name: dim_product
    description: >
      Product dimension (SCD Type 1: current state; natural key).
      Grain: one row per product. PK: product_id.
      Measures carried as attributes: unit_price, unit_cost.
      Upstream: int_products, int_categories.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: category_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_categories')
                field: category_id

  - name: dim_campaign
    description: >
      Marketing campaign dimension from the campaign API snapshot
      (SCD Type 1). Grain: one row per campaign. PK: campaign_id.
      Attributes: budget_eur, spend_eur, impressions, clicks (current
      snapshot; derived KPIs live in mart_marketing_roi, slice 3).
      Upstream: int_campaigns.
    columns:
      - name: campaign_id
        tests: [unique, not_null]
      - name: channel
        tests:
          - accepted_values:
              arguments:
                values: ["search", "display", "social", "email", "video"]
      - name: campaign_status
        tests:
          - accepted_values:
              arguments:
                values: ["active", "paused", "completed", "scheduled"]

  - name: dim_customer
    description: >
      Delete-aware customer dimension rebuilt from immutable CDC history.
      Grain: one row per committed non-delete customer version. PK:
      customer_key ('<customer_id>_<event_id>'). Initial r events form the
      pre-streaming baseline; streamed versions use inclusive valid_from_lsn
      and exclusive valid_to_lsn boundaries. A delete closes the preceding
      version and emits no row; a later create starts a new lifecycle. Source
      timestamps are audit-only. Upstream: int_cdc_customer_versions.
    columns:
      - name: customer_key
        tests: [unique, not_null]
      - name: customer_id
        tests: [not_null]
      - name: customer_status
        tests:
          - accepted_values:
              arguments:
                values: ["active", "inactive", "churned"]
      - name: segment
        tests:
          - accepted_values:
              arguments:
                values: ["standard", "premium", "vip"]
      - name: valid_from_lsn
        description: Inclusive streamed boundary; NULL only for an initial r baseline.
      - name: valid_to_lsn
        description: Exclusive next customer transaction boundary; NULL only while open.
      - name: is_snapshot_baseline
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: event_id
        tests: [unique, not_null]

  - name: fact_orders
    description: >
      Delete-aware current order fact. Grain: one row per live CDC order. PK:
      order_id. Measures: shipping_cost, order_total (source currency).
      customer_key is frozen at the current order lifecycle's r/c boundary:
      an r order uses the customer baseline; a c order uses the half-open
      customer LSN interval containing its creation transaction. Later order
      updates do not re-key the fact and there is no fallback. Upstream:
      int_cdc_orders_current, stg_cdc_orders, dim_customer.
    columns:
      - name: order_id
        tests: [unique, not_null]
      - name: customer_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customer')
                field: customer_key
      - name: order_status
        tests:
          - accepted_values:
              arguments:
                values: ["pending", "paid", "shipped", "delivered", "cancelled", "refunded"]

  - name: fact_order_items
    description: >
      Snapshot-backed order-line fact, parent-gated by live CDC orders.
      Grain: one row per captured order line whose parent exists in
      fact_orders. PK: order_item_id. Measures: quantity, unit_price,
      line_total. New-order lines can lag until the next snapshot; stale
      lines disappear immediately after a CDC parent delete. Upstream:
      int_order_items, fact_orders; FK to dim_product.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: product_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_product')
                field: product_id

  - name: fact_payments
    description: >
      Delete-aware current payment fact. Grain: one row per live CDC payment.
      PK: payment_id. Measures: payment_amount. Degenerate: transaction_id.
      Reconciliation against fact_orders remains fail-loud at a stable
      consumed boundary. Upstream: int_cdc_payments_current.
    columns:
      - name: payment_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: payment_status
        tests:
          - accepted_values:
              arguments:
                values: ["pending", "authorized", "captured", "failed", "refunded", "cancelled"]

  - name: fact_shipments
    description: >
      Snapshot-backed shipment fact, parent-gated by live CDC orders. Grain:
      one row per captured shipment whose parent exists in fact_orders. PK:
      shipment_id. New-order shipments can lag until the next snapshot;
      stale shipments disappear after a CDC parent delete. Degenerate:
      tracking_number. Upstream: int_shipments, fact_orders.
    columns:
      - name: shipment_id
        tests: [unique, not_null]
      - name: order_id
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fact_orders')
                field: order_id
      - name: shipment_status
        tests:
          - accepted_values:
              arguments:
                values: ["pending", "in_transit", "delivered", "cancelled"]

name: omni-retail-data-platform

# Shared Airflow service environment (Phase 4 design spec §8, ADR 0003):
# LocalExecutor, dedicated metadata PostgreSQL, secrets from .env, and the
# Phase 3 ingestion variables repointed at docker-network addresses.
x-airflow-env: &airflow-env
  AIRFLOW__CORE__EXECUTOR: LocalExecutor
  AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
  AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "True"
  AIRFLOW__CORE__LOAD_EXAMPLES: "False"
  AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_POSTGRES_USER}:${AIRFLOW_POSTGRES_PASSWORD}@airflow-postgres:5432/${AIRFLOW_POSTGRES_DB}
  PYTHONPATH: /opt/airflow
  S3_ENDPOINT_URL: http://minio:9000
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
  MOCK_API_BASE_URL: http://mock-api:9002
  POSTGRES_HOST: postgres
  POSTGRES_PORT: "5432"
  POSTGRES_USER: ${POSTGRES_USER}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  POSTGRES_DB: ${POSTGRES_DB}
  # Stable CDC boundary probes (ADR 0008). These are Docker-network addresses;
  # host CLI defaults remain loopback values in .env.example.
  KAFKA_BOOTSTRAP_SERVERS: kafka:29092
  KAFKA_CONNECT_URL: http://debezium-connect:8083
  CDC_CONSUMER_GROUP_ID: ${CDC_CONSUMER_GROUP_ID:-omni-iceberg-bronze-cdc-v1}
  CDC_TOPIC_PREFIX: omni.oltp
  CDC_BOUNDARY_STABILITY_SECONDS: ${CDC_BOUNDARY_STABILITY_SECONDS:-10}
  CDC_BOUNDARY_TIMEOUT_SECONDS: ${CDC_BOUNDARY_TIMEOUT_SECONDS:-300}
  CDC_BOUNDARY_REQUEST_TIMEOUT_SECONDS: ${CDC_BOUNDARY_REQUEST_TIMEOUT_SECONDS:-10}
  # Lakehouse tasks (Phase 5 slice 3): the bronze loader and dbt connect to
  # Trino over the docker network; defaults live in TrinoConfig/profiles.yml.
  TRINO_HOST: trino
  TRINO_PORT: "8080"
  # Serving publication runs inside the Docker network; do not use the
  # host-loopback defaults used by the local CLI.
  CLICKHOUSE_HOST: clickhouse
  CLICKHOUSE_PORT: "8123"
  CLICKHOUSE_DB: analytics
  CLICKHOUSE_PUBLISHER_USER: ${CLICKHOUSE_PUBLISHER_USER}
  CLICKHOUSE_PUBLISHER_PASSWORD: ${CLICKHOUSE_PUBLISHER_PASSWORD}

x-airflow-volumes: &airflow-volumes
  # DAGs stay thin wrappers (AGENTS §19): helpers and tests are mounted
  # read-only next to the DAG folder.
  - ./airflow/dags:/opt/airflow/dags:ro
  - ./airflow/include:/opt/airflow/include:ro
  - ./airflow/tests:/opt/airflow/tests:ro
  # dbt project for transform_lakehouse (read-only; artifacts go to a per-run
  # temp dir via --target-path/--log-path).
  - ./dbt:/opt/airflow/dbt:ro
  - airflow-logs:/opt/airflow/logs

services:
  postgres:
    image: postgres:16.15-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
      - -c
      - max_slot_wal_keep_size=2GB
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    profiles: ["core"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    profiles: ["core"]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ENDPOINT_URL: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
    volumes:
      - ./infrastructure/scripts/minio_init.sh:/usr/local/bin/minio_init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/minio_init.sh"]
    restart: "no"

  polaris-postgres:
    image: postgres:16.15-alpine
    profiles: ["core"]
    environment:
      POSTGRES_USER: ${POLARIS_POSTGRES_USER}
      POSTGRES_PASSWORD: ${POLARIS_POSTGRES_PASSWORD}
      POSTGRES_DB: ${POLARIS_POSTGRES_DB}
    volumes:
      - polaris-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POLARIS_POSTGRES_USER} -d ${POLARIS_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  polaris-bootstrap:
    image: apache/polaris-admin-tool:1.7.0
    profiles: ["core"]
    depends_on:
      polaris-postgres:
        condition: service_healthy
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-postgres:5432/${POLARIS_POSTGRES_DB}
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_POSTGRES_PASSWORD}
    command:
      - bootstrap
      - --realm=POLARIS
      - --credential=POLARIS,${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}
    restart: "no"

  polaris:
    image: apache/polaris:1.7.0
    profiles: ["core"]
    depends_on:
      polaris-bootstrap:
        condition: service_completed_successfully
    environment:
      POLARIS_PERSISTENCE_TYPE: relational-jdbc
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_DATABASE_TYPE: postgresql
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_RETRIES: "10"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_INITIAL_DELAY_IN_MS: "250"
      POLARIS_PERSISTENCE_RELATIONAL_JDBC_MAX_DURATION_IN_MS: "30000"
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://polaris-postgres:5432/${POLARIS_POSTGRES_DB}
      QUARKUS_DATASOURCE_USERNAME: ${POLARIS_POSTGRES_USER}
      QUARKUS_DATASOURCE_PASSWORD: ${POLARIS_POSTGRES_PASSWORD}
      POLARIS_REALM_CONTEXT_REALMS: POLARIS
      POLARIS_BOOTSTRAP_CREDENTIALS: POLARIS,${POLARIS_CLIENT_ID},${POLARIS_CLIENT_SECRET}
      polaris.features."ALLOW_INSECURE_STORAGE_TYPES": "true"
      # Trino 483 always issues dropTable(purge=true) on REST catalogs, and
      # Polaris purge-drops (tables AND views) require this flag; without it
      # every DROP from Trino fails authorization/feature checks.
      polaris.features."DROP_WITH_PURGE_ENABLED": "true"
      polaris.features."SUPPORTED_CATALOG_STORAGE_TYPES": '["FILE","S3","GCS","AZURE"]'
      polaris.readiness.ignore-severe-issues: "true"
      # Polaris resolves S3 credentials from the default AWS chain;
      # static MinIO keys are provided via environment variables.
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      JAVA_OPTIONS: -Xmx2g
    ports:
      - "127.0.0.1:8181:8181"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8182/q/health"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  polaris-init:
    image: python:3.12-alpine
    profiles: ["core"]
    depends_on:
      polaris:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      POLARIS_BASE_URL: http://polaris:8181
      POLARIS_REALM: POLARIS
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      POLARIS_CATALOG_NAME: lakehouse
      MINIO_ENDPOINT_URL: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: lakehouse
    volumes:
      - ./infrastructure/scripts/polaris_init.py:/usr/local/bin/polaris_init.py:ro
    entrypoint: ["python", "/usr/local/bin/polaris_init.py"]
    restart: "no"

  trino:
    # NOTE: Trino 483 is affected by trinodb/trino#30816 (merged after this
    # release; no released image contains the fix yet). Each catalog operation
    # may fetch a fresh OAuth2 token against Polaris; rapid writes can lose auth
    # and yield empty-body 401s. Bronze uses bounded chunk retries and the
    # explicit rebuild command can restart Polaris before resuming.
    image: trinodb/trino:483
    profiles: ["core"]
    depends_on:
      polaris-init:
        condition: service_completed_successfully
    environment:
      POLARIS_CLIENT_ID: ${POLARIS_CLIENT_ID}
      POLARIS_CLIENT_SECRET: ${POLARIS_CLIENT_SECRET}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./trino/etc:/etc/trino:ro
    healthcheck:
      # A status endpoint can turn green while the coordinator still rejects
      # SQL during catalog initialization; require an executable query instead.
      test: ["CMD-SHELL", "trino --execute 'select 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  mock-api:
    image: omni-retail/mock-api:0.1.0
    build:
      context: ./infrastructure/mock_api
    profiles: ["core"]
    environment:
      MOCK_API_SEED: ${MOCK_API_SEED:-42}
    ports:
      - "127.0.0.1:${MOCK_API_PORT:-9002}:9002"
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9002/healthz', timeout=2)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # PostgreSQL CDC transport and raw Bronze sink (Phase 8, ADR 0006).
  postgres-cdc-init:
    image: postgres:16.15-alpine
    profiles: ["streaming"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      DEBEZIUM_POSTGRES_USER: ${DEBEZIUM_POSTGRES_USER}
      DEBEZIUM_POSTGRES_PASSWORD: ${DEBEZIUM_POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/scripts/postgres_cdc_init.sh:/usr/local/bin/postgres_cdc_init.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres_cdc_init.sh"]
    restart: "no"

  postgres-cdc-reset:
    image: postgres:16.15-alpine
    profiles: ["streaming"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/scripts/postgres_cdc_reset.sh:/usr/local/bin/postgres_cdc_reset.sh:ro
    entrypoint: ["/bin/sh", "/usr/local/bin/postgres_cdc_reset.sh"]
    restart: "no"

  kafka:
    image: apache/kafka:4.3.0
    profiles: ["streaming"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:${KAFKA_PORT:-9092}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "127.0.0.1:${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:29092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  kafka-topics-init:
    image: apache/kafka:4.3.0
    profiles: ["streaming"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    volumes:
      - ./infrastructure/scripts/kafka_topics_init.sh:/usr/local/bin/kafka_topics_init.sh:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/kafka_topics_init.sh"]
    restart: "no"

  debezium-connect:
    image: quay.io/debezium/connect:3.6.1.Final
    profiles: ["streaming"]
    depends_on:
      kafka-topics-init:
        condition: service_completed_successfully
    environment:
      BOOTSTRAP_SERVERS: kafka:29092
      GROUP_ID: omni-connect
      CONFIG_STORAGE_TOPIC: omni-connect-configs
      OFFSET_STORAGE_TOPIC: omni-connect-offsets
      STATUS_STORAGE_TOPIC: omni-connect-status
      CONFIG_STORAGE_REPLICATION_FACTOR: "1"
      OFFSET_STORAGE_REPLICATION_FACTOR: "1"
      STATUS_STORAGE_REPLICATION_FACTOR: "1"
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
      REST_ADVERTISED_HOST_NAME: debezium-connect
      HEAP_OPTS: -Xms256m -Xmx768m
    ports:
      - "127.0.0.1:${KAFKA_CONNECT_PORT:-8083}:8083"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8083/connectors"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s
    mem_limit: 1g
    restart: unless-stopped

  debezium-connector-init:
    image: python:3.12.12-alpine
    profiles: ["streaming"]
    depends_on:
      debezium-connect:
        condition: service_healthy
      postgres-cdc-init:
        condition: service_completed_successfully
    environment:
      KAFKA_CONNECT_URL: http://debezium-connect:8083
      POSTGRES_DB: ${POSTGRES_DB}
      DEBEZIUM_POSTGRES_USER: ${DEBEZIUM_POSTGRES_USER}
      DEBEZIUM_POSTGRES_PASSWORD: ${DEBEZIUM_POSTGRES_PASSWORD}
    volumes:
      - ./infrastructure/scripts/debezium_connector_init.py:/usr/local/bin/debezium_connector_init.py:ro
    entrypoint: ["python", "/usr/local/bin/debezium_connector_init.py"]
    restart: "no"

  cdc-consumer:
    image: omni-retail/cdc-consumer:0.1.0
    build:
      context: .
      dockerfile: infrastructure/cdc/Dockerfile
    profiles: ["streaming"]
    depends_on:
      debezium-connector-init:
        condition: service_completed_successfully
      trino:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      CDC_CONSUMER_GROUP_ID: ${CDC_CONSUMER_GROUP_ID:-omni-iceberg-bronze-cdc-v1}
      CDC_TOPIC_PREFIX: omni.oltp
      CDC_BATCH_SIZE: ${CDC_BATCH_SIZE:-500}
      CDC_POLL_TIMEOUT_SECONDS: ${CDC_POLL_TIMEOUT_SECONDS:-1}
      CDC_WRITE_ATTEMPTS: ${CDC_WRITE_ATTEMPTS:-3}
      CDC_READINESS_FILE: /tmp/cdc-consumer.ready
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_USER: omni_cdc
      ICEBERG_BRONZE_SCHEMA: ${ICEBERG_BRONZE_SCHEMA:-bronze}
    healthcheck:
      test: ["CMD", "python", "-m", "omni_retail.streaming.cdc", "healthcheck", "--path", "/tmp/cdc-consumer.ready", "--max-age-seconds", "60"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    mem_limit: 512m
    restart: unless-stopped

  # ClickHouse serving layer (Phase 6, profile `bi`, ADR 0004). Only the
  # HTTP interface is published to the host (loopback): the native port 9000
  # stays docker-network-only because MinIO already owns host 9000.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8.11.7
    profiles: ["bi"]
    environment:
      # Admin (`default`) account: used only by clickhouse-init migrations;
      # access management is enabled so migration 0002 can create the
      # service accounts. Reachable only inside the docker network + loopback.
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-8123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  clickhouse-init:
    image: clickhouse/clickhouse-server:26.8.11.7
    profiles: ["bi"]
    depends_on:
      clickhouse:
        condition: service_healthy
    environment:
      CLICKHOUSE_INIT_HOST: clickhouse
      CLICKHOUSE_INIT_PORT: "9000"
      CLICKHOUSE_ADMIN_PASSWORD: ${CLICKHOUSE_ADMIN_PASSWORD}
      CLICKHOUSE_PUBLISHER_PASSWORD: ${CLICKHOUSE_PUBLISHER_PASSWORD}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
    volumes:
      - ./infrastructure/scripts/clickhouse_init.sh:/usr/local/bin/clickhouse_init.sh:ro
      - ./clickhouse/migrations:/migrations:ro
    entrypoint: ["/bin/bash", "/usr/local/bin/clickhouse_init.sh"]
    restart: "no"

  # Superset BI layer (Phase 7, profile `bi`, ADR 0005). The web UI is
  # published loopback-only; both database connections use docker-network
  # hostnames (clickhouse:8123, trino:8080), so dashboards need no ClickHouse
  # exposure beyond the existing loopback HTTP port.
  superset-postgres:
    image: postgres:16.15-alpine
    profiles: ["bi"]
    environment:
      POSTGRES_USER: ${SUPERSET_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SUPERSET_POSTGRES_DB}
    volumes:
      - superset-metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SUPERSET_POSTGRES_USER} -d ${SUPERSET_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  superset:
    image: omni-retail/superset:0.1.0
    build:
      context: .
      dockerfile: infrastructure/superset/Dockerfile
    profiles: ["bi"]
    depends_on:
      superset-postgres:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/repo/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_POSTGRES_USER: ${SUPERSET_POSTGRES_USER}
      SUPERSET_POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
      SUPERSET_POSTGRES_DB: ${SUPERSET_POSTGRES_DB}
    # The image's own CMD (run-server.sh) starts gunicorn: 1 worker,
    # gthread, 20 threads, 0.0.0.0:8088 — tunable via SUPERSET_* env and
    # inside the workstation budget (guide §12.2). In Superset 5.0.0 the
    # WSGI target is the create_app() factory (FLASK_APP), not an `app`
    # attribute, so a hand-written gunicorn command is not duplicated here.
    ports:
      - "127.0.0.1:${SUPERSET_PORT:-8088}:8088"
    volumes:
      - ./superset:/app/superset_home/repo:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  superset-init:
    image: omni-retail/superset:0.1.0
    profiles: ["bi"]
    depends_on:
      superset:
        condition: service_healthy
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_home/repo/superset_config.py
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
      SUPERSET_POSTGRES_USER: ${SUPERSET_POSTGRES_USER}
      SUPERSET_POSTGRES_PASSWORD: ${SUPERSET_POSTGRES_PASSWORD}
      SUPERSET_POSTGRES_DB: ${SUPERSET_POSTGRES_DB}
      SUPERSET_ADMIN_USER: ${SUPERSET_ADMIN_USER}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD}
      # Reader account + docker-network ClickHouse address (loopback defaults
      # in .env are for host-side CLI only).
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PORT: "8123"
      CLICKHOUSE_DB: analytics
      CLICKHOUSE_READER_USER: ${CLICKHOUSE_READER_USER}
      CLICKHOUSE_READER_PASSWORD: ${CLICKHOUSE_READER_PASSWORD}
      # Trino has no local auth (documented local-only posture, ADR 0005).
      TRINO_HOST: trino
      TRINO_PORT: "8080"
      TRINO_CATALOG: iceberg
      TRINO_USER: omni_superset
      SUPERSET_ASSETS_DIR: /app/superset_home/repo/assets
    volumes:
      - ./superset:/app/superset_home/repo:ro
      - ./infrastructure/scripts/superset_init.py:/usr/local/bin/superset_init.py:ro
    entrypoint: ["python", "/usr/local/bin/superset_init.py"]
    restart: "no"

  airflow-postgres:
    image: postgres:16.15-alpine
    profiles: ["orchestration"]
    environment:
      POSTGRES_USER: ${AIRFLOW_POSTGRES_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_POSTGRES_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_POSTGRES_DB}
    volumes:
      - airflow-metadata-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_POSTGRES_USER} -d ${AIRFLOW_POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  airflow-init:
    image: omni-retail/airflow:0.1.0
    build:
      context: .
      dockerfile: infrastructure/airflow/Dockerfile
    profiles: ["orchestration"]
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_WWW_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_WWW_PASSWORD}
    volumes: *airflow-volumes
    # The image entrypoint runs db migrate + admin user creation first, then
    # exec's this command (Phase 4 design spec §8).
    command: >
      bash -c "airflow pools set mock_api 2 'mock external API concurrency limit'"
    restart: "no"

  airflow-webserver:
    image: omni-retail/airflow:0.1.0
    profiles: ["orchestration"]
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-env
    volumes: *airflow-volumes
    command: webserver
    ports:
      - "127.0.0.1:${AIRFLOW_WEBSERVER_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  airflow-scheduler:
    image: omni-retail/airflow:0.1.0
    profiles: ["orchestration"]
    user: "${AIRFLOW_UID:-50000}:0"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
      airflow-webserver:
        condition: service_healthy
    environment: *airflow-env
    volumes: *airflow-volumes
    command: scheduler
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "airflow jobs check --job-type SchedulerJob --hostname $(hostname)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  polaris-postgres-data:
  airflow-metadata-data:
  airflow-logs:
  clickhouse-data:
  superset-metadata-data:
  kafka-data:

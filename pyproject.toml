[project]
name = "omni-retail-data-platform"
version = "0.1.0"
description = "Production-like e-commerce data platform: batch ingestion, Iceberg lakehouse (Trino + dbt), ClickHouse serving, BI, and orchestration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_retail"]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "ruff>=0.6,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omni_retail"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

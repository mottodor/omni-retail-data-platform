[project]
name = "omni-retail-data-platform"
version = "0.1.0"
description = "Production-like e-commerce data platform: batch ingestion, Iceberg lakehouse (Trino + dbt), ClickHouse serving, BI, and orchestration."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.35,<2",
    "dbt-core>=1.10,<1.11",
    "dbt-trino>=1.9,<1.10",
    "httpx>=0.27,<1",
    "openpyxl>=3.1,<4",
    "psycopg[binary]>=3.2,<4",
    "pyarrow>=21,<24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/omni_retail"]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.35,<2",
    "mypy>=1.11,<2",
    "pre-commit>=4,<5",
    "pytest>=8,<9",
    "pyyaml>=6.0.3",
    "ruff>=0.6,<1",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["omni_retail"]
mypy_path = "infrastructure/mock_api/src"

[[tool.mypy.overrides]]
module = ["pyarrow.*", "openpyxl.*", "trino.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests", "infrastructure/mock_api/src"]
addopts = "-ra"

[tool.uv]
# Constraints keep shared libraries compatible with the packages frozen inside
# apache/airflow:2.11.2-python3.12, so the overlay installed into the custom
# Airflow image (uv export --no-dev) stays `pip check` clean:
#   aiobotocore 3.2.1            -> botocore<1.42.62
#   awswrangler 3.15.1           -> pyarrow<23
#   opentelemetry-sdk 1.40.0     -> opentelemetry-api==1.40.0
constraint-dependencies = [
    "botocore<1.42.62",
    "opentelemetry-api==1.40.0",
    "pyarrow<23",
]
